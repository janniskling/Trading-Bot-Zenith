name: Zenith – Midday Check

on:
  schedule:
    - cron: '30 16 * * 1-5'  # 16:30 UTC = 18:30 Berlin (Mo-Fr)
  workflow_dispatch:

jobs:
  midday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Midday Check Step
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_START_DATE: ${{ secrets.TRADING_START_DATE }}
        run: python main.py --step midday

      - name: Commit midday log
        run: |
          git config user.name "Zenith Bot"
          git config user.email "zenith-bot@users.noreply.github.com"
          git add knowledge/daily_log.md
          git diff --staged --quiet || (git pull --rebase && git commit -m "chore: midday log $(date -u +%Y-%m-%d) [skip ci]" && git push)
