name: Zenith – Market Close

on:
  schedule:
    - cron: '0 20 * * 1-5'  # 20:00 UTC = 22:00 Berlin (Mo-Fr)
  workflow_dispatch:

jobs:
  market-close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Market Close Step
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_START_DATE: ${{ secrets.TRADING_START_DATE }}
        run: python main.py --step market_close

      - name: Commit daily log archive
        run: |
          git config user.name "Zenith Bot"
          git config user.email "zenith-bot@users.noreply.github.com"
          git add knowledge/daily_log.md logs/
          git diff --staged --quiet || (git commit -m "chore: market-close archive $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase && git push)
